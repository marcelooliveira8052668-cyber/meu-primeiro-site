<!DOCTYPE html>
<html lang="pt-Br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Meu primeiro site</title>
        <style>
            body {
                background-color: black;
                color: white;
                font-family: Arial, Helvetica, sans-serif;
                text-align: center;
                padding-top: 50px;
            }
            
            /* Estado inicial: escondido de verdade */
            .escondido {
                display: none !important;
            }

            .caixa-mensagem {
                margin-top: 20px;
                padding: 15px;
                background-color: #222;
                border: 2px solid #555;
                display: inline-block;
                border-radius: 8px;
            }
        </style>
    </head>
    <body>

        <h1>Meu primeiro Site</h1>
        <img src="https://tse3.mm.bing.net/th/id/OIP.1s9wUnOmlvsKyLfuHCbgdAHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" width="400" alt="">
        
        <br><br>
        
        <button id="meuBotao">Clique aqui</button>

        <div id="mensagem" class="escondido caixa-mensagem">
            <p>Oba! Você clicou no botão e a mágica aconteceu! 🚀</p>
        </div>

        <script>
            const botao = document.getElementById('meuBotao');
            const mensagem = document.getElementById('mensagem');

            botao.addEventListener('click', function() {
                mensagem.classList.toggle('escondido');
            });
        </script>
    </body>
</html>
